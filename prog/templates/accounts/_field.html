<div class="field{% if field.errors %} field--error{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="field__control">
    {{ field }}
    {% if field.field.widget.input_type == "password" %}
    <button type="button" class="field__toggle js-toggle-password" aria-label="Mostrar senha" aria-pressed="false" data-target="{{ field.id_for_label }}"><i class="bi bi-eye" aria-hidden="true"></i></button>
    {% endif %}
  </div>
  {% if field.help_text %}<p class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="field__error" id="{{ field.id_for_label }}_error" role="alert">{{ e }}</p>{% endfor %}
</div>
